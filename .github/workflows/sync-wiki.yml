name: Sync Wiki

# Publishes documentation/ to this module's GitHub wiki on every commit to the default branch that
# touches the docs. What goes live is folder membership minus the HOLD map in tools/wiki-sync.mjs,
# NOT what changed: a held doc is never published, so a commit touching one cannot leak it.
# Runs on GitHub's servers — nothing to run locally.

on:
  push:
    # Both, because this file is copied to every module unchanged and the suite is split across
    # main and master. A single-branch trigger on the wrong one does not fail -- it never fires, and
    # the module simply has no wiki. Listing both is correct everywhere and needs no per-module edit.
    branches: [main, master]
    paths:
      - 'documentation/**'
      - 'tools/wiki-sync.mjs'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch: {}   # also runnable by hand from the Actions tab

permissions:
  contents: write         # needed for the token to push to the repo's wiki

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build wiki pages
        run: node tools/wiki-sync.mjs build

      - name: Publish to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki-repo
          # Mirror: drop existing pages, copy the freshly built ones in.
          find wiki-repo -maxdepth 1 -name '*.md' -delete
          cp tools/.wiki-build/*.md wiki-repo/
          cd wiki-repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki already up to date — nothing to publish."
          else
            git commit -m "Sync wiki from documentation/ @ ${GITHUB_SHA::7}"
            git push
          fi
